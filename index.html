<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IG 帳號起步健檢與定位助手</title>
    <style>
        :root {
            --primary: #e1306c; /* IG 經典粉紅 */
            --primary-dark: #c13584;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --pill-pink-bg: #fce7f3;
            --pill-pink-text: #be185d;
            --pill-green-bg: #f0fdf4;
            --pill-green-text: #15803d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
        }

        .header {
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            color: white;
            padding: 20px 16px;
            text-align: center;
        }

        .header h1 { margin: 0; font-size: 1.3rem; font-weight: 800; }
        .header p { margin: 6px 0 0 0; font-size: 0.825rem; opacity: 0.9; }

        .container { padding: 20px 16px; max-width: 550px; margin: 0 auto; }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #f1f5f9;
        }

        .hidden { display: none !important; }

        .pill-tag {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.825rem;
            font-weight: 700;
        }
        .pill-pink { background-color: var(--pill-pink-bg); color: var(--pill-pink-text); }
        .pill-green { background-color: var(--pill-green-bg); color: var(--pill-green-text); }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.875rem; font-weight: 700; margin-bottom: 6px; color: #1e293b; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .checkbox-group { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
        .checkbox-label { font-size: 0.85rem; color: #334155; font-weight: normal; display: flex; align-items: center; gap: 8px; cursor: pointer; }

        .score-box {
            text-align: center;
            padding: 16px;
            background: #faf5ff;
            border-radius: 16px;
            border: 1px solid #f3e8ff;
            margin: 16px 0;
        }

        .score-number { font-size: 2.5rem; font-weight: 900; color: #7e22ce; }

        .prompt-box {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 16px;
            border-radius: 12px;
            font-size: 0.825rem;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 12px 0;
            max-height: 180px;
            overflow-y: auto;
            font-family: monospace;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { background-color: var(--primary-dark); }
        .btn-secondary { background-color: #0f172a; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📸 IG 帳號商業起步健檢助手</h1>
        <p>輸入 IG 帳號與現況 ➔ 取得健康度評分與定位診斷</p>
    </div>

    <div class="container">

        <!-- 健檢輸入表單 -->
        <div id="form-card" class="card">
            <span class="pill-tag pill-pink" style="margin-bottom: 12px;">🔍 帳號資料檢測</span>

            <div class="form-group">
                <label>1. 你的 IG 帳號（請輸入 @Handle）</label>
                <input type="text" id="handle" placeholder="例：@your_instagram_id">
            </div>

            <div class="form-group">
                <label>2. 你的商業賽道 / 角色定位</label>
                <input type="text" id="niche" placeholder="例：健身教練 / 保健品經銷 / 美甲師 / 團購創作者">
            </div>

            <div class="form-group">
                <label>3. 目前粉絲人數</label>
                <select id="followers">
                    <option value="low">🌱 低於 1,000 人（起步破圈期）</option>
                    <option value="mid">🌿 1,000 - 5,000 人（信任累積期）</option>
                    <option value="high">🚀 5,000 人以上（高效率變現期）</option>
                </select>
            </div>

            <div class="form-group">
                <label>4. 目前帳號基礎建設（可多選）</label>
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" id="check_bio"> 個人檔案（Bio）有寫清楚『我是誰/能幫你解決什麼』</label>
                    <label class="checkbox-label"><input type="checkbox" id="check_link"> 個人檔案有放導流連結（如：Line / 預約表單 / 官網）</label>
                    <label class="checkbox-label"><input type="checkbox" id="check_highlight"> 有設定精選限動（如：關於我、學員/客戶見證、服務流程）</label>
                    <label class="checkbox-label"><input type="checkbox" id="check_reels"> 每週至少穩定產出 2 支以上的 Reels 短影音</label>
                </div>
            </div>

            <button class="btn" onclick="analyzeAccount()">📊 開始帳號健檢分析</button>
        </div>

        <!-- 健檢結果卡片 -->
        <div id="result-card" class="card hidden">
            <span class="pill-tag pill-green">🎯 帳號健檢診斷報告</span>
            <h2 id="result-handle" style="margin: 10px 0 4px 0; font-size: 1.25rem;"></h2>

            <div class="score-box">
                <div style="font-size: 0.85rem; color: #6b21a8; font-weight: 700;">帳號健康度綜合評分</div>
                <div id="score-val" class="score-number">0</div>
                <div id="score-text" style="font-size: 0.825rem; color: #581c87;"></div>
            </div>

            <div class="section">
                <div style="font-weight: 700; font-size: 0.9rem; color: #1e293b; margin-bottom: 6px;">💡 優先優化建議：</div>
                <ul id="advice-list" style="font-size: 0.875rem; color: #475569; padding-left: 20px; margin: 0; line-height: 1.6;"></ul>
            </div>

            <hr style="border: 0; border-top: 1px solid #f1f5f9; margin: 16px 0;">

            <span class="pill-tag pill-pink">🤖 貼給 AI 的專屬深度健檢 Prompt</span>
            <p style="font-size: 0.8rem; color: #64748b; margin-top: 6px;">點擊下方複製，直接貼給 ChatGPT / Gemini，讓 AI 幫你寫 10 支短影音腳本：</p>

            <div id="prompt-output" class="prompt-box"></div>

            <button class="btn" onclick="copyPrompt()">📋 一鍵複製 AI 健檢 Prompt</button>
            <button class="btn btn-secondary" onclick="resetForm()">🔄 重新健檢其他帳號</button>
        </div>

    </div>

    <script>
        function analyzeAccount() {
            const handle = document.getElementById('handle').value || '@your_account';
            const niche = document.getElementById('niche').value || '個人品牌';
            const followers = document.getElementById('followers').value;

            const cBio = document.getElementById('check_bio').checked;
            const cLink = document.getElementById('check_link').checked;
            const cHighlight = document.getElementById('check_highlight').checked;
            const cReels = document.getElementById('check_reels').checked;

            // 計算分數
            let score = 40; // 基礎分
            if (cBio) score += 15;
            if (cLink) score += 15;
            if (cHighlight) score += 15;
            if (cReels) score += 15;

            // 建議產出
            let advice = [];
            if (!cBio) advice.push("<b>優化 Bio：</b>個人簡介第一行請明確寫出『我能幫你解決什麼問題』，不要只寫星座或幽默短句。");
            if (!cLink) advice.push("<b>建立導流點：</b>個人檔案缺乏外部連結，會浪費流量！請設定 Line 官方帳號或預約表單。");
            if (!cHighlight) advice.push("<b>補強精選限動：</b>建議建立『關於我』與『學員/客戶見證』精選，新粉進來才能快速建立信任。");
            if (!cReels) advice.push("<b>提高短影音頻率：</b>演算法目前偏好 Reels，建議每週穩定發佈 2-3 支【破解迷思型】短影片。");

            if (advice.length === 0) {
                advice.push("<b>表現極佳！</b>帳號基礎建置完整，接下來請專注於優化影片前 3 秒的 Hook（黃金開頭）以提昇轉換率。");
            }

            document.getElementById('result-handle').innerText = `帳號：${handle}（${niche}）`;
            document.getElementById('score-val').innerText = `${score} / 100`;
            
            let scoreComment = "";
            if (score < 60) scoreComment = "⚠️ 基礎建置尚未完整，流量進來容易流失";
            else if (score < 85) scoreComment = "📈 基礎良好，調整內容結構即可快速變現";
            else scoreComment = "🔥 帳號結構相當健康，適合加大投流或高頻發片";

            document.getElementById('score-text').innerText = scoreComment;

            const adviceUl = document.getElementById('advice-list');
            adviceUl.innerHTML = '';
            advice.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = item;
                adviceUl.appendChild(li);
            });

            // Prompt 產生
            const promptText = `你是一位 IG 帳號營運與短影音內容行銷專家。請幫我對 IG 帳號【${handle}】進行深度內容規劃。

【帳號基本背景】
- 賽道/身份：${niche}
- 目前粉絲規模：${followers === 'low' ? '低於 1,000 人（起步期）' : '1,000-5,000人'}
- 目前健檢評分：${score}分
- 待優化項目：${advice.map(a => a.replace(/<[^>]+>/g, '')).join('; ')}

【請幫我產出】
1. 一段適合修改到 IG 個人檔案（Bio）的 3 行黃金介紹文案（含明確 CTA）。
2. 5 支專為【${niche}】設計的 30 秒 Reels 腳本（需包含 Hook 開頭、Value 內容與 CTA 結尾）。`;

            document.getElementById('prompt-output').innerText = promptText;

            document.getElementById('form-card').classList.add('hidden');
            document.getElementById('result-card').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function copyPrompt() {
            const promptText = document.getElementById('prompt-output').innerText;
            navigator.clipboard.writeText(promptText).then(() => {
                alert('複製成功！現在可以打開 ChatGPT 或 Gemini 貼上使用了。');
            });
        }

        function resetForm() {
            document.getElementById('form-card').classList.remove('hidden');
            document.getElementById('result-card').classList.add('hidden');
        }
    </script>
</body>
</html>
